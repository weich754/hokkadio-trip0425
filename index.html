<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>北海道賞櫻</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="北海道賞櫻">
    <meta name="theme-color" content="#F48FB1">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.5.2/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sakura-bg': '#FFF5F8',      
                        'sakura-pink': '#F48FB1',         
                        'sakura-dark': '#D81B60',       
                        'hokkaido-blue': '#64B5F6',        
                        'spring-green': '#81C784',      
                        'slate-800': '#1E293B',
                    },
                    animation: { 'fade-in': 'fadeIn 0.2s ease-out', 'zoom-in': 'zoomIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)' }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        body { background-color: #FFF5F8; font-family: 'Noto Sans TC', sans-serif; color: #1E293B; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #ffffff; box-shadow: 0 0 30px rgba(30, 41, 59, 0.1); position: relative; padding-bottom: 90px; }
        .header-bg { border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; overflow: hidden; z-index: 10; position: relative; box-shadow: 0 4px 15px rgba(244, 143, 177, 0.2); background-color: #cbd5e1; }
        .header-image-container { width: 100%; height: 220px; position: relative; background-color: #e2e8f0; }
        .side-tab-bar { position: absolute; bottom: 30px; right: 16px; z-index: 50; display: flex; gap: 8px; }
        .tab-button { width: 42px; height: 42px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(244, 143, 177, 0.3); transition: all 0.2s; background-color: white; color: #F48FB1; }
        .tab-button.active { background-color: #D81B60; color: white; transform: scale(1.1); }
        .date-selector-sticky { background-color: white; border-bottom: 1px solid #f1f5f9; z-index: 20; top: 0; position: sticky; }
        .date-active { background-color: #D81B60 !important; color: white !important; border-color: #D81B60 !important; }
        .card-shadow { box-shadow: 0 4px 20px rgba(30, 41, 59, 0.05); border: 1px solid #f8fafc; }
        .note-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: #F1F5F9; color: #64748B; font-weight: bold; }
        .fab-shadow { box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .image-preview { width: 100%; height: 100px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }
        .sync-badge { position: absolute; top: env(safe-area-inset-top, 16px); right: 16px; z-index: 50; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 99px; backdrop-filter: blur(4px); cursor: pointer; border: 1px solid rgba(255,255,255,0.3); margin-top: 10px; }
    </style>
</head>
<body>

<div id="app" class="app-container">
    <div class="header-bg">
        <div class="header-image-container relative">
            
            <input type="file" id="coverInput" accept="image/*" class="hidden" @change="handleCoverUpload">
            <img :src="coverImage" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent z-20 pointer-events-none"></div>
            
            <button @click="triggerCoverUpload" class="absolute top-4 left-4 z-30 bg-black/40 hover:bg-black/60 text-white border border-white/30 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-lg flex items-center gap-1">
                <i class="fa-solid fa-camera"></i> 更換封面
            </button>

            <div @click="showSyncModal = true" class="sync-badge text-white text-xs font-bold flex items-center gap-2 shadow-lg z-30">
                <i class="fa-solid fa-satellite-dish" :class="isConnected ? 'text-green-400 animate-pulse' : 'text-slate-300'"></i>
                <span>{{ isConnected ? '已連線同步中' : '雙人同步' }}</span>
            </div>

            <div class="absolute bottom-4 left-6 text-white z-30">
                <h1 class="text-xl font-bold drop-shadow-lg">北海道深度賞櫻行</h1>
                <p class="text-xs opacity-90 drop-shadow-md mt-1">4.25 - 5.03 | 函館．洞爺湖．札幌</p>
            </div>
        </div>
        
        <div class="side-tab-bar">
            <button @click="currentTab = 'itinerary'" :class="{'active': currentTab === 'itinerary'}" class="tab-button"><i class="fa-solid fa-calendar-day"></i></button>
            <button @click="currentTab = 'info'" :class="{'active': currentTab === 'info'}" class="tab-button"><i class="fa-solid fa-utensils"></i></button>
            <button @click="currentTab = 'shopping'" :class="{'active': currentTab === 'shopping'}" class="tab-button"><i class="fa-solid fa-bag-shopping"></i></button>
        </div>
    </div>

    <div v-if="enlargedImage" @click="enlargedImage = null" class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-2 backdrop-blur-md animate-fade-in cursor-zoom-out">
        <img :src="enlargedImage" @click.stop class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl animate-zoom-in">
        <button @click="enlargedImage = null" class="absolute top-6 right-6 text-white bg-white/20 hover:bg-red-500 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-xl shadow-lg">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div v-if="showSyncModal" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-6 backdrop-blur-sm animate-fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl relative overflow-hidden max-h-[90vh] overflow-y-auto">
            <button @click="showSyncModal = false" class="absolute top-4 right-5 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="font-bold text-lg mb-2 text-center text-slate-800"><i class="fa-solid fa-heart text-sakura-pink mr-2 text-xl"></i>專屬雙人連線房</h3>
            
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4 text-center mt-4">
                <p class="text-xs font-bold text-slate-500 mb-2">【 方案 A：即時自動連線 】</p>
                <div class="w-full text-center text-3xl font-mono font-bold tracking-widest text-sakura-dark bg-white border-2 border-sakura-pink/30 rounded-xl p-3 mb-3 shadow-inner">
                    041887
                </div>
                
                <button v-if="!isConnected" @click="connectToRoom" class="w-full py-3 rounded-xl bg-hokkaido-blue text-white font-bold text-sm shadow-md hover:bg-blue-500 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-link"></i> 點擊連線
                </button>
                
                <div v-else class="space-y-2">
                    <button @click="forcePush" class="w-full py-2.5 rounded-xl bg-sakura-dark text-white font-bold text-xs shadow-md hover:bg-pink-600 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 強制覆蓋對方資料
                    </button>
