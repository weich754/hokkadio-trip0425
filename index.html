<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北海道深度賞櫻行 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sakura-bg': '#FFF5F8',      
                        'sakura-pink': '#F48FB1',         
                        'sakura-dark': '#D81B60',       
                        'hokkaido-blue': '#64B5F6',        
                        'spring-green': '#81C784',      
                        'slate-800': '#1E293B',
                    },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out' }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        body { background-color: #FFF5F8; font-family: 'Noto Sans TC', sans-serif; color: #1E293B; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #ffffff; box-shadow: 0 0 30px rgba(30, 41, 59, 0.1); position: relative; padding-bottom: 90px; }
        .header-bg { border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; overflow: hidden; z-index: 10; position: relative; box-shadow: 0 4px 15px rgba(244, 143, 177, 0.2); }
        .header-image-container { width: 100%; height: 200px; position: relative; }
        .header-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .side-tab-bar { position: absolute; bottom: 30px; right: 16px; z-index: 30; display: flex; gap: 8px; }
        .tab-button { width: 42px; height: 42px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(244, 143, 177, 0.3); transition: all 0.2s; background-color: white; color: #F48FB1; }
        .tab-button.active { background-color: #D81B60; color: white; transform: scale(1.1); }
        .date-selector-sticky { background-color: white; border-bottom: 1px solid #f1f5f9; z-index: 20; top: 0; position: sticky; }
        .date-active { background-color: #D81B60 !important; color: white !important; border-color: #D81B60 !important; }
        .card-shadow { box-shadow: 0 4px 20px rgba(30, 41, 59, 0.05); border: 1px solid #f8fafc; }
        .note-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: #F1F5F9; color: #64748B; font-weight: bold; }
        .fab-shadow { box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="app" class="app-container">
    <div class="header-bg">
        <div class="header-image-container">
            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80">
            <div class="absolute bottom-0 left-0 w-full h-full bg-gradient-to-t from-black/50 to-transparent"></div>
            <div class="absolute bottom-4 left-6 text-white">
                <h1 class="text-xl font-bold">北海道深度賞櫻行</h1>
                <p class="text-xs opacity-80">4.25 - 5.03 | 函館．洞爺湖．札幌</p>
            </div>
        </div>
        <div class="side-tab-bar">
            <button @click="currentTab = 'itinerary'" :class="{'active': currentTab === 'itinerary'}" class="tab-button"><i class="fa-solid fa-calendar-day"></i></button>
            <button @click="currentTab = 'info'" :class="{'active': currentTab === 'info'}" class="tab-button"><i class="fa-solid fa-utensils"></i></button>
            <button @click="currentTab = 'shopping'" :class="{'active': currentTab === 'shopping'}" class="tab-button"><i class="fa-solid fa-bag-shopping"></i></button>
        </div>
    </div>

    <main class="p-4">
        <div v-if="currentTab === 'itinerary'" class="animate-fade-in">
            <div class="flex overflow-x-auto hide-scrollbar space-x-2 pb-4 mb-4 date-selector-sticky -mx-4 px-4 pt-2">
                <div v-for="(day, index) in dates" :key="index" @click="selectedDateIndex = index"
                     class="flex-shrink-0 w-14 h-16 rounded-xl flex flex-col items-center justify-center cursor-pointer border transition-all duration-200"
                     :class="selectedDateIndex === index ? 'date-active shadow-md scale-105' : 'bg-white text-slate-400 border-slate-100'">
                    <span class="text-[10px] font-bold uppercase
